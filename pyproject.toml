[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshellgame"
version = "0.1.0"
description = "A backend-engineering learning game played through a fictional shell."
requires-python = ">=3.10"
dependencies = ["flask>=3"]

[project.scripts]
pyshellgame = "pyshellgame.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
